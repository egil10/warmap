<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>War Map</title>
  <meta name="description" content="Wars and armed conflicts on a map, month by month. Data from Wikipedia and Wikidata.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <aside class="panel" id="panel">
    <div class="head">
      <h1>War Map</h1>
      <div class="views" role="group" aria-label="View">
        <button id="btn-globe" class="on">Globe</button>
        <button id="btn-flat">Map</button>
      </div>
    </div>
    <div class="filters">
      <input id="search" type="search" placeholder="Search" autocomplete="off">
      <label><input type="checkbox" id="only-ongoing"> Ongoing only</label>
    </div>
    <div class="count"><span id="count">0</span> conflicts</div>
    <ul id="list"></ul>
  </aside>

  <section class="detail hidden" id="detail">
    <button class="close" id="detail-close" aria-label="Close">×</button>
    <img id="d-img" alt="">
    <h2 id="d-name"></h2>
    <div class="meta" id="d-meta"></div>
    <p id="d-extract"></p>
    <div class="meta" id="d-countries"></div>
    <a id="d-link" target="_blank" rel="noopener">Wikipedia ↗</a>
  </section>

  <footer class="timeline">
    <button id="play" aria-label="Play">
      <svg viewBox="0 0 16 16" width="14" height="14"><path id="play-icon" d="M4 2.5v11l9-5.5z"/></svg>
    </button>
    <button id="prev" aria-label="Previous month">‹</button>
    <div class="date" id="date">—</div>
    <button id="next" aria-label="Next month">›</button>
    <input type="range" id="slider" min="0" max="100" value="100" aria-label="Date">
    <select id="era" aria-label="Time range">
      <option value="-1000,500">1000 BC – 500</option>
      <option value="500,1500">500 – 1500</option>
      <option value="1500,1800">1500 – 1800</option>
      <option value="1800,1945">1800 – 1945</option>
      <option value="1900,now" selected>1900 – today</option>
    </select>
  </footer>

  <div class="credit">
    <span class="key"><i class="k-on"></i>Ongoing <i class="k-past"></i>Active <i class="k-site"></i>Battle</span>
    <span>Data <a href="https://www.wikidata.org" target="_blank" rel="noopener">Wikidata</a>, <a href="https://en.wikipedia.org" target="_blank" rel="noopener">Wikipedia</a> · <a href="https://github.com/egil10/warmap" target="_blank" rel="noopener">Source</a></span>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
