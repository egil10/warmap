name: Refresh war data
on:
  schedule:
    - cron: "0 4 * * 1"   # weekly, Monday 04:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_wars.py
        timeout-minutes: 40
      - name: Commit if changed
        run: |
          if [ "$(python -c "import json;print(len(json.load(open('data/wars.json'))['wars']))")" -lt 1000 ]; then echo "Suspiciously small dataset, skipping"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/wars.json
          git diff --cached --quiet || (git commit -m "Refresh war data from Wikidata" && git push)
